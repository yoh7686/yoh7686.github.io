<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <!-- The game fills the browser window, whatever its size and orientation (owner, 10-08:
         on an iPhone the fixed-size page did not show the whole game). -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>PerfectDayForFactorization</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { position: fixed; inset: 0; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #000; touch-action: none; outline: none; }
      #loading { position: fixed; left: 50%; top: 50%; width: 40vw; max-width: 320px; height: 4px; transform: translate(-50%, -50%); background: #1a2a2e; }
      #loading-bar { width: 0; height: 100%; background: #bff2ff; }
      #warning { position: fixed; left: 0; right: 0; top: 0; font: 14px sans-serif; color: #000; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="loading-bar"></div></div>
    <div id="warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        div.style = "padding: 8px; background: " + (type == "error" ? "#f44" : "#ff4") + ";";
        banner.appendChild(div);
        if (type != "error") setTimeout(function () { banner.removeChild(div); }, 5000);
      }

      var buildUrl = "Build";
      // Every file asked for with the build's version, so a phone never runs new data on old
      // code left in its cache (an iPhone showed a crash after an update: 10-08).
      var v = "?v=" + encodeURIComponent("2026.10.09.0929");
      var loaderUrl = buildUrl + "/PDPF.loader.js" + v;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/PDPF.data.unityweb" + v,
        frameworkUrl: buildUrl + "/PDPF.framework.js.unityweb" + v,
        codeUrl: buildUrl + "/PDPF.wasm.unityweb" + v,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "PerfectDayForFactorization",
        productVersion: "2026.10.09.0929",
        showBanner: unityShowBanner,
        // Phones draw at up to twice the CSS pixels, not three times: sharp enough, and far
        // lighter on an iPhone.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#loading-bar").style.width = 100 * progress + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
