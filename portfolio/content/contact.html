<link rel="stylesheet" href="/portfolio/assets/contact.css"><script type="module" src="/portfolio/assets/contact-game.mjs"></script><section class="contact-game"><p class="contact-intro">タイルを回して、入口から出口まで線をつないでください。<br>つながると、お問い合わせフォームへのボタンが表示されます。</p><div class="route-stage"><span class="route-start">入口 →</span><div id="contact-board" class="route-board" role="group" aria-label="線をつなぐパズル"></div><span class="route-end">出口 →</span></div><p id="contact-status" class="contact-status" role="status" aria-live="polite"></p><div class="contact-controls"><button type="button" id="contact-reset">最初から</button><button type="button" id="contact-hint">ヒント</button></div><p id="contact-hint-text" hidden>入口から、中央 → 上 → 右上 → 右中央 → 右下 → 出口の順につなぎます。</p><details><summary>操作方法</summary><p>クリックまたはタップで、タイルが右に90度回転します。キーボードではTabキーでタイルを選び、Enterまたはスペースキーで回転できます。時間制限はありません。</p></details><div id="contact-finish" class="contact-finish" hidden><button id="contact-open" class="contact-open" type="button" disabled>フォームを準備中</button><p class="muted">Googleフォームが開きます。メールアドレスとお問い合わせ内容をご入力ください。</p></div><noscript><p>このページの操作にはJavaScriptを有効にしてください。</p></noscript></section>
